services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerlab-postgres
    environment:
      POSTGRES_DB: ledgerlab
      POSTGRES_USER: ledgerlab
      POSTGRES_PASSWORD: ledgerlab
    ports:
      - "5433:5432"
    volumes:
      - ledgerlab-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlab -d ledgerlab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledgerlab-pg:
